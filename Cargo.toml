[package]
name = "odk-locations"
version = "0.1.0"
edition = "2021"

[lib]
name = "odk_locations"
path = "src/lib.rs"

[[bin]]
name = "odk-locations"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
geo = "0.30"
geojson = "0.24"
geozero = { version = "0.14", features = ["with-wkb", "with-geo"] }
parquet = "56"
arrow = "56"
proj4rs = "0.1"
crs-definitions = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
